<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Bix Client Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #442061;
      --purple-dark: #2E1442;
      --charcoal: #0E0A1A;
      --muted: rgba(14,10,26,0.52);
      --hair: rgba(14,10,26,0.1);
      --input-bg: #fff;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Card */
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 44px 48px 48px;
      width: 100%;
      max-width: 480px;
      box-shadow:
        0 1px 2px rgba(14,10,26,0.04),
        0 8px 24px rgba(14,10,26,0.08),
        0 32px 64px -16px rgba(14,10,26,0.12);
    }

    /* Brand row */
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }
    .brand-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--purple);
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .brand-icon svg { display: block; }
    .brand-name {
      font-size: 18px;
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 13px;
      color: var(--muted);
      font-weight: 400;
    }

    /* Eyebrow */
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    /* Heading */
    .heading {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 500;
      color: var(--charcoal);
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 10px;
    }

    /* Description */
    .desc {
      font-size: 14.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* Form */
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--charcoal);
      margin-bottom: 8px;
    }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 1px solid var(--hair);
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      color: var(--charcoal);
      background: var(--input-bg);
      outline: none;
      transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
      -webkit-appearance: none;
    }
    .input-wrap input::placeholder { color: rgba(14,10,26,0.3); }
    .input-wrap input:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(68,32,97,0.12);
    }
    .input-wrap input.has-toggle { padding-right: 48px; }

    /* Eye toggle */
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--muted);
      display: grid; place-items: center;
      transition: color 200ms;
    }
    .toggle-pw:hover { color: var(--charcoal); }

    /* Remember + forgot row */
    .extras {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .remember input[type="checkbox"] { display: none; }
    .checkmark {
      width: 20px; height: 20px;
      border-radius: 5px;
      border: 1.5px solid var(--hair);
      background: #fff;
      display: grid; place-items: center;
      transition: background 200ms, border-color 200ms;
      flex-shrink: 0;
    }
    .checkmark svg { opacity: 0; transition: opacity 150ms; }
    .remember input:checked + .checkmark {
      background: var(--purple);
      border-color: var(--purple);
    }
    .remember input:checked + .checkmark svg { opacity: 1; }
    .remember-label {
      font-size: 14px;
      color: var(--charcoal);
    }
    .forgot {
      font-size: 14px;
      font-weight: 600;
      color: var(--purple);
      text-decoration: none;
      transition: opacity 200ms;
    }
    .forgot:hover { opacity: 0.75; }

    /* Submit */
    .submit-btn {
      width: 100%;
      height: 54px;
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 220ms var(--ease), transform 200ms var(--ease), box-shadow 220ms var(--ease);
      box-shadow: 0 6px 20px rgba(68,32,97,0.32);
    }
    .submit-btn:hover {
      background: var(--purple-dark);
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(68,32,97,0.38);
    }
    .submit-btn:active { transform: translateY(0); }
    .submit-btn svg { transition: transform 300ms var(--ease); }
    .submit-btn:hover svg { transform: translateX(3px); }

    @media (max-width: 520px) {
      .card { padding: 32px 24px 36px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <path d="M7 6h7a5 5 0 0 1 0 10H7V6z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M7 16h8a5 5 0 0 1 0 10H7V16z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" opacity=".55"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Bix</div>
        <div class="brand-sub">Client Portal</div>
      </div>
    </div>

    <!-- Header -->
    <p class="eyebrow">Welcome back</p>
    <h1 class="heading">Sign in to your account</h1>
    <p class="desc">Access your project, invoices, files and messages — all in one place.</p>

    <!-- Form -->
    <form id="loginForm" novalidate>

      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@company.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="has-toggle"
            required
          />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="extras">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember" checked />
          <span class="checkmark">
            <svg width="11" height="9" viewBox="0 0 11 9" fill="none">
              <path d="M1 4.5l3 3 6-7" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="remember-label">Remember me</span>
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">
        Sign in
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    </form>
  </div>

  <script>
    // Password visibility toggle
    var pwInput = document.getElementById('password');
    var toggleBtn = document.getElementById('togglePw');
    toggleBtn.addEventListener('click', function () {
      var isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      toggleBtn.querySelector('svg').style.opacity = isHidden ? '0.5' : '1';
    });
  </script>
</body>
</html>
