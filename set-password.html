<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Your Password — Bix Client Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #442061;
      --purple-dark: #2E1442;
      --charcoal: #0E0A1A;
      --muted: rgba(14,10,26,0.52);
      --hair: rgba(14,10,26,0.08);
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f0f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 44px 48px 48px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 1px 2px rgba(14,10,26,0.04), 0 8px 24px rgba(14,10,26,0.08), 0 32px 64px -16px rgba(14,10,26,0.12);
    }
    .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
    .brand-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--purple);
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .brand-name { font-size: 18px; font-weight: 600; color: var(--charcoal); line-height: 1.2; }
    .brand-sub { font-size: 13px; color: var(--muted); font-weight: 400; }
    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; letter-spacing: 0.14em;
      color: var(--muted); text-transform: uppercase; margin-bottom: 10px;
    }
    .heading { font-size: clamp(22px, 4vw, 28px); font-weight: 500; color: var(--charcoal); letter-spacing: -0.02em; margin-bottom: 8px; }
    .desc { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 14px; font-weight: 500; color: var(--charcoal); margin-bottom: 8px; }
    .input-wrap { position: relative; }
    .input-wrap input {
      width: 100%; height: 50px; padding: 0 48px 0 16px;
      border: 1px solid var(--hair); border-radius: 10px;
      font-family: inherit; font-size: 15px; color: var(--charcoal);
      background: #fff; outline: none;
      transition: border-color 200ms, box-shadow 200ms;
      -webkit-appearance: none;
    }
    .input-wrap input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(68,32,97,0.12); }
    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; padding: 4px;
      color: var(--muted); display: grid; place-items: center; transition: color 200ms;
    }
    .toggle-pw:hover { color: var(--charcoal); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .error-msg {
      font-size: 13.5px; color: #c0392b;
      background: #fdf0ef; border: 1px solid #f5c6c2;
      border-radius: 8px; padding: 10px 14px;
      margin-bottom: 16px; display: none;
    }
    .submit-btn {
      width: 100%; height: 54px;
      background: var(--purple); color: #fff;
      border: none; border-radius: 12px;
      font-family: inherit; font-size: 16px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 220ms, transform 200ms, box-shadow 220ms;
      box-shadow: 0 6px 20px rgba(68,32,97,0.32);
    }
    .submit-btn:hover { background: var(--purple-dark); transform: translateY(-1px); box-shadow: 0 10px 28px rgba(68,32,97,0.38); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .success-state { text-align: center; padding: 16px 0; }
    .success-icon { font-size: 40px; margin-bottom: 12px; }
    .success-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .success-sub { font-size: 14px; color: var(--muted); }
    @media (max-width: 520px) { .card { padding: 32px 24px 36px; border-radius: 20px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <path d="M7 6h7a5 5 0 0 1 0 10H7V6z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M7 16h8a5 5 0 0 1 0 10H7V16z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" opacity=".55"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Bix</div>
        <div class="brand-sub">Client Portal</div>
      </div>
    </div>

    <div id="formView">
      <p class="eyebrow">You're invited</p>
      <h1 class="heading">Set your password</h1>
      <p class="desc">Choose a password to secure your Bix client portal account.</p>

      <p class="error-msg" id="errMsg"></p>

      <form id="setPasswordForm">
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
            <button type="button" class="toggle-pw" id="toggle1" aria-label="Show password">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
          </div>
          <p class="hint">At least 8 characters</p>
        </div>
        <div class="field">
          <label for="confirm">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="confirm" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
            <button type="button" class="toggle-pw" id="toggle2" aria-label="Show password">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">
          <span id="btnLabel">Set Password &amp; Sign In</span>
        </button>
      </form>
    </div>

    <div id="successView" style="display:none">
      <div class="success-state">
        <div class="success-icon">✓</div>
        <div class="success-title">Password set!</div>
        <p class="success-sub">Taking you to your portal…</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPA_URL = 'https://mvgyjeocdsngldirehlv.supabase.co';
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Z3lqZW9jZHNuZ2xkaXJlaGx2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NTEwMjUsImV4cCI6MjA5ODMyNzAyNX0.zUzw9X-WPUZ454WU27TI-Svjcs6VycSITmxxZHBSBlQ';
    const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

    // Supabase puts the token in the URL hash after invite link is clicked
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') {
        // Session is active — user can now set their password
      }
    });

    // Password toggles
    [['toggle1','password'],['toggle2','confirm']].forEach(function([btnId, inputId]) {
      document.getElementById(btnId).addEventListener('click', function() {
        var inp = document.getElementById(inputId);
        var show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        this.querySelector('svg').style.opacity = show ? '0.5' : '1';
      });
    });

    document.getElementById('setPasswordForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var pw = document.getElementById('password').value;
      var confirm = document.getElementById('confirm').value;
      var errEl = document.getElementById('errMsg');
      var btn = document.getElementById('submitBtn');
      var label = document.getElementById('btnLabel');

      errEl.style.display = 'none';

      if (pw !== confirm) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }
      if (pw.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      label.textContent = 'Setting password…';

      var { error } = await sb.auth.updateUser({ password: pw });

      if (error) {
        errEl.textContent = error.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        label.textContent = 'Set Password & Sign In';
        return;
      }

      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
      setTimeout(function() { window.location.href = 'client-portal.html'; }, 1500);
    });
  </script>
</body>
</html>
